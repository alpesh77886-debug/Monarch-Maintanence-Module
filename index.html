<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MONARCH Maintenance Module</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 3rem;
      max-width: 600px;
    }
    h1 {
      font-size: 2.5rem;
      color: #4fc3f7;
      margin-bottom: 1rem;
      letter-spacing: 2px;
    }
    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #a0a0b0;
      margin-bottom: 0.5rem;
    }
    .badge {
      display: inline-block;
      background: rgba(79, 195, 247, 0.15);
      border: 1px solid rgba(79, 195, 247, 0.3);
      color: #4fc3f7;
      padding: 0.4rem 1.2rem;
      border-radius: 999px;
      font-size: 0.85rem;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>MONARCH Maintenance</h1>
    <p>Repository initialized and GitHub Pages enabled.</p>
    <p>Application code will be deployed here shortly.</p>
    <span class="badge">Under Construction</span>
  </div>
</body>
</html>
