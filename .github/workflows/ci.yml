name: CI

on:
  # `branches: ["**"]` here meant every PR commit triggered TWO identical runs
  # (once as `push`, once as `pull_request`). That doubled the sign-in load on
  # the one live Supabase project and ran two suites against the same data at
  # the same time. Branch work reaches CI through its PR; `main` is covered on
  # merge.
  push:
    branches: [main]
  pull_request:

# The test suites mutate a single shared live Supabase project, so two runs of
# the same ref must never overlap. Superseded runs are cancelled rather than
# left racing the newer one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # F-05: explicit acknowledgement that writing test rows to the
      # configured Supabase project is intended here. Without it the suites
      # refuse to run, so a future production project cannot be polluted by a
      # forgotten env var. See FORENSIC_REMEDIATION_RECON.md F-05.
      - run: npm test
        env:
          MAINTENANCE_TEST_WRITES_OK: "1"
          # Loop 41 (F-41-2). `concurrency` above is keyed on github.ref, so a
          # PR run and a main-branch run are in DIFFERENT groups and can
          # overlap. The teardown used to select purely on a time window, so
          # whichever run finished first deleted the other's IN-FLIGHT cases.
          # Every case is now stamped with this id and a run deletes only its
          # own. The `-unit` suffix matters: without it this job and the e2e
          # job of the SAME workflow run would share an id and clean up each
          # other's rows.
          MAINTENANCE_TEST_RUN_ID: "${{ github.run_id }}-${{ github.run_attempt }}-unit"

  # Browser E2E (RISK-05). Separate job because it needs a browser install
  # and builds/starts the app itself; runs only once lint/build/unit are
  # green, so a broken build fails fast in the cheaper job.
  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          MAINTENANCE_TEST_WRITES_OK: "1"
          # Distinct from the unit job's id — see the comment there.
          MAINTENANCE_TEST_RUN_ID: "${{ github.run_id }}-${{ github.run_attempt }}-e2e"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
